<style>
  /* Same rules as wvez.org: no borders, no fades, black text only. */
  :root { --bg: #ffffff; --fg: #000000; --muted: #888888; --fill: #f4f4f4; --font: "IBM Plex Mono", monospace; }
  :root[data-theme="dark"] { --bg: #000000; --fg: #ffffff; --fill: #1a1a1a; color-scheme: dark; }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); letter-spacing: 0.03em; -webkit-font-smoothing: antialiased; padding: 1rem; }
  button { font: inherit; letter-spacing: inherit; color: inherit; background: none; border: none; cursor: pointer; text-align: left; }
  :focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
  .label { font-size: 0.6rem; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); }

  .wf { max-width: 760px; margin: 0 auto; }
  .wf-head { margin-bottom: 0.75rem; }
  .wf-head .label { margin-bottom: 0.35rem; }
  .wf-title { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.01em; }

  .wf-canvas { position: relative; overflow: hidden; background: var(--fill); }
  .wf-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .wf-edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .edge { fill: none; stroke: var(--muted); stroke-width: 1.5; }
  .edge.main { stroke-dasharray: 6 5; }
  .edge.sub { stroke-dasharray: 1.5 4; stroke-linecap: round; }
  .edge.hot { stroke: var(--fg); }
  .edge-label { fill: var(--muted); font-family: var(--font); font-size: 8px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--fill); stroke-width: 5px; stroke-linejoin: round; }

  .wf-node { position: absolute; padding: 7px 8px; background: var(--bg); }
  .wf-node:hover { color: var(--muted); }
  .wf-node.sel, .wf-node.sel:hover { background: var(--fg); color: var(--bg); }
  .n-top { display: flex; align-items: center; justify-content: space-between; height: 14px; }
  .n-icon svg { display: block; width: 13px; height: 13px; }
  .n-type { font-size: 6.5px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  .n-title { margin-top: 7px; font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .is-n8n .wf-node .n-title { margin-top: 6px; white-space: normal; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .is-n8n .n-icon svg { width: 15px; height: 15px; }
  .p-title .label { margin-left: 0.5rem; }
  .n-tag { position: absolute; height: 22px; display: flex; align-items: flex-end; font-size: 7px; line-height: 10px; letter-spacing: 0.02em; color: var(--muted); pointer-events: none; }
  .is-n8n .wf-panel { display: block; }
  .is-n8n .p-desc { margin-top: 0.3rem; }

  .wf-panel { display: flex; gap: 0.75rem; align-items: baseline; padding-top: 0.75rem; min-height: 3.2rem; }
  .p-title { flex: 0 0 auto; font-size: 0.75rem; font-weight: 600; }
  .p-desc { font-size: 0.75rem; line-height: 1.6; }

  /* phone view: a plain list, tap a node to read it */
  .wf-stack { display: none; }
  .wf.is-stack .wf-canvas, .wf.is-stack .wf-panel { display: none; }
  .wf.is-stack .wf-stack { display: block; }
  .st-link { width: 1px; height: 0.7rem; margin-left: 1rem; background: repeating-linear-gradient(var(--muted) 0 3px, transparent 3px 6px); }
  .st-gap { height: 1rem; }
  .st-item { display: block; width: 100%; min-width: 0; padding: 0.55rem 0.7rem; background: var(--fill); }
  .st-item[aria-expanded="true"] { background: var(--fg); color: var(--bg); }
  .st-item .n-title { margin-top: 0.3rem; font-size: 0.75rem; white-space: normal; }
  .st-item .p-desc { display: none; margin-top: 0.4rem; font-size: 0.72rem; }
  .st-item[aria-expanded="true"] .p-desc { display: block; }
  .st-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.5rem; }
  .st-subs { margin: 0.5rem 0 0 1.25rem; }
  .st-row .label { display: block; margin-bottom: 0.3rem; }
