<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · WVEZ Solutions{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  {%- feed_meta -%}

  <style>
    /* Same rules as the landing page: no borders, no fades, black text only. */
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --muted: #888888;
      --font: "IBM Plex Mono", monospace;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-weight: 400;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    nav.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 3.25rem;
      padding: 0 2rem;
      flex: 0 0 auto;
    }

    .brand {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .nav-here {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    main {
      flex: 1 0 auto;
      width: 100%;
      max-width: 44rem;
      margin: 0 auto;
      padding: 1.5rem 2rem 4rem;
    }

    footer.foot {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 2.5rem;
      padding: 0 2rem;
      font-size: 0.55rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer.foot a:hover { color: var(--fg); }

    @media (max-width: 640px) {
      nav.top, footer.foot { padding: 0 1.25rem; }
      main { padding: 1.25rem 1.25rem 3rem; }
      .brand { font-size: 0.65rem; letter-spacing: 0.15em; }
      footer.foot { font-size: 0.5rem; letter-spacing: 0.18em; }
    }
  </style>
</head>
<body>

  <nav class="top">
    <a class="brand" href="/">wvez solutions</a>
    <span class="nav-here">{{ page.nav_label | default: "Writing" }}</span>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="foot">
    <span>&copy; WVEZ Solutions LLC &middot; Chicago</span>
    <a href="/feed.xml">RSS</a>
  </footer>

</body>
</html>
