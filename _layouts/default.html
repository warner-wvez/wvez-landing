<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · WVEZ Solutions{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  {%- feed_meta -%}
  <script src="/assets/blog/theme.js"></script>

  <style>
    /* Same rules as the landing page: no borders, no fades, black text only. */
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --muted: #707070;   /* darkest grey that still reads as grey: 4.5:1 on --fill, the WCAG AA bar */
      --fill: #f4f4f4;
      --font: "IBM Plex Mono", monospace;
    }

    /* Dark mode is the same page inverted. The bulb's glass is the only colour. */
    :root[data-theme="dark"] {
      --bg: #000000;
      --fg: #ffffff;
      --fill: #1a1a1a;
      --muted: #888888;   /* #707070 fails on black; #888 is 4.9:1 on --fill */
      color-scheme: dark;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-weight: 400;
      letter-spacing: 0.03em;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }

    nav.top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 3.25rem;
      padding: 0 2rem;
      flex: 0 0 auto;
    }

    .brand {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .nav-here {
      font-size: 0.6rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
    }

    main {
      flex: 1 0 auto;
      width: 100%;
      max-width: 47rem; /* 43rem (688px) of text plus 2rem a side */
      margin: 0 auto;
      padding: 1.5rem 2rem 4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      justify-content: safe center;
    }

    footer.foot {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 2.5rem;
      padding: 0 2rem;
      font-size: 0.55rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }

    footer.foot a:hover { color: var(--fg); }

    /* Light switch: a pixel-art dot on a string that swings, hanging from the
       top of the window in line with the section rail. Pull it or tap it.
       The canvas is drawn at half size and scaled up so every pixel shows. */
    nav.top { padding-right: 4.5rem; }
    .pull-switch {
      position: fixed;
      top: 0;
      right: 4px;
      z-index: 150;
      width: 96px;
      height: 104px;
      pointer-events: none;
    }
    .pull-switch canvas {
      display: block;
      width: 96px;
      height: 104px;
      image-rendering: pixelated;
    }
    .pull-dot {
      position: absolute;
      top: 0;
      left: 0;
      width: 24px;
      height: 24px;
      padding: 0;
      border: 0;
      background: none;
      cursor: grab;
      touch-action: none;
      pointer-events: auto;
    }
    .pull-dot.grabbing { cursor: grabbing; }
    .pull-dot:focus-visible { outline: 1px solid var(--fg); outline-offset: 0; }

    @media (max-width: 640px) {
      nav.top, footer.foot { padding: 0 1.25rem; }
      nav.top { padding-right: 3.75rem; }
      main { padding: 1.25rem 1.25rem 3rem; }
      .brand { font-size: 0.65rem; letter-spacing: 0.15em; }
      footer.foot { font-size: 0.5rem; letter-spacing: 0.18em; }
    }
  </style>
</head>
<body>

  <nav class="top">
    <a class="brand" href="/">wvez solutions</a>
    <span class="nav-here">{{ page.nav_label | default: "Writing" }}</span>
  </nav>

  <main>
    {{ content }}
  </main>

  <footer class="foot">
    <span>&copy; WVEZ Solutions LLC &middot; Chicago</span>
    <a href="/feed.xml">RSS</a>
  </footer>

  <!-- Visit counts: GoatCounter, no cookies. Dashboard at wvez.goatcounter.com -->
  <script data-goatcounter="https://wvez.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
