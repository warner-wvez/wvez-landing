---
layout: default
---
<style>
  .post-head { margin-bottom: 2.5rem; }

  .post-date {
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .post-title {
    font-size: 1.45rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.25;
  }

  .post-body { font-size: 0.9rem; line-height: 1.7; max-width: 68ch; }
  .post-body > * + * { margin-top: 1.1rem; }

  .post-body h2 {
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    margin-top: 2.25rem;
  }

  .post-body h3 {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 1.75rem;
  }

  .post-body a { text-decoration: underline; text-underline-offset: 0.2em; }
  .post-body a:hover { color: var(--muted); }

  .post-body ul, .post-body ol { padding-left: 1.25rem; }
  .post-body li + li { margin-top: 0.4rem; }

  .post-body img {
    display: block;
    max-width: 100%;
    height: auto;
    image-rendering: auto;
    margin: 1.75rem 0;
  }

  .post-body blockquote {
    padding-left: 1rem;
    border-left: 2px solid var(--fg);
    color: var(--muted);
  }

  .post-body pre {
    font-size: 0.78rem;
    line-height: 1.55;
    padding: 0.9rem 1rem;
    background: #f4f4f4;
    overflow-x: auto;
  }

  .post-body code { font-size: 0.82rem; background: #f4f4f4; padding: 0.05em 0.3em; }
  .post-body pre code { background: none; padding: 0; font-size: inherit; }

  .post-body hr { border: 0; border-top: 1px solid var(--muted); margin: 2.5rem 0; }

  .notice {
    padding: 1rem 1.15rem;
    background: #f4f4f4;
    font-size: 0.82rem;
    line-height: 1.6;
  }
  .notice > *:first-child { margin-top: 0; }
  .notice > *:last-child { margin-bottom: 0; }
  .notice p + p { margin-top: 0.7rem; }

  .post-foot {
    margin-top: 3.5rem;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .post-foot a:hover { color: var(--fg); }
</style>

<article>
  <header class="post-head">
    <div class="post-date">{{ page.date | date: "%B %-d, %Y" }}</div>
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-body">
    {{ content }}
  </div>

  <div class="post-foot">
    <a href="/#writing">All writing</a>
  </div>
</article>
